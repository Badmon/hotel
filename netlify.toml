[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect SPA: cualquier ruta que no sea un archivo estático o una
# función debe resolver a index.html para que React Router maneje la
# navegación en el cliente. Sin esto, refrescar /admin/reservations
# devolvería 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
