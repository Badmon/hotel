name: Keep Supabase awake

# Supabase pausa los proyectos del plan free tras 7 días sin actividad.
# Este workflow le pega a la API cada 3 días para que nunca llegue a
# ese límite, sin necesidad de tráfico real de usuarios.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/room_types?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase respondió con status $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase devolvió un error ($status). Revisar si el proyecto sigue activo."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
